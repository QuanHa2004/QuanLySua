spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000    # 15 phút (tính bằng mili-giây)
  refresh-token-expiration: 604800000 # 7 ngày (tính bằng mili-giây)


vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_}
  url: ${VNPAY_URL}
  return-url: ${VNPAY_RETURN_URL}
